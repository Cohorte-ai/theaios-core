[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "theaios-core"
version = "0.1.0"
description = "Shared foundations of the theaios libraries: safe expressions, env interpolation, audit logs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Charafeddine Mouzouni", email = "charafeddine@cohorte.co" },
]
keywords = ["ai-agents", "agent-governance", "policy-engine", "audit-log"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "ruff>=0.15,<0.16", "mypy>=1.19,<1.20"]

[project.urls]
Homepage = "https://github.com/Cohorte-ai/theaios-core"
Repository = "https://github.com/Cohorte-ai/theaios-core"

[tool.hatch.build.targets.wheel]
packages = ["src/theaios"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
